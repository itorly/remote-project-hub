spring:
  datasource:
    url: jdbc:h2:mem:remote_project_hub;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

security:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hs256
    validity-ms: 3600000